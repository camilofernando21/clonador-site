<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clonador</title>
    <link rel="icon" href="favicon.png" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box;
        font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: #12141a; background: #f2f4f9; }
      main { max-width: 520px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 14px 0 8px; font-size: 32px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: #5b6170; }
      a { color: #1b5cff; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="favicon.png" alt="" />
      <h1>Clonador</h1>
      <p>Clone a página aberta em um projeto editável: HTML, CSS, imagens e fontes, sem rastreadores e pronto para abrir.</p>
      <p><a href="privacidade/">Política de privacidade</a></p>
    </main>
  </body>
</html>
